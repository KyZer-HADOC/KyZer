name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Check core JavaScript
        run: npm run check
      - name: Check libraries and plugins
        shell: bash
        run: |
          set -e
          for file in lib/*.js plugins/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
      - name: Smoke-test HTTP health endpoint
        shell: bash
        run: |
          set -e
          PORT=10000 node index.js >/tmp/kyzer.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:10000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kyzer.log
          exit 1
